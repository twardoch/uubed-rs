# this_file: crates/uubed-python/Cargo.toml
[package]
include = ["src/**/*.rs", "tests/**/*.rs", "benches/**/*.rs", "examples/**/*.rs", "Cargo.toml", "LICENSE", "README.md"]
name = "uubed-python"
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "uubed_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
codec = { package = "uubed-core", path = "../uubed-core", version = "1.0.14" }
uubed-tm = { path = "../uubed-tm", version = "1.0.14" }
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1"

[features]
simd = ["codec/simd"]
