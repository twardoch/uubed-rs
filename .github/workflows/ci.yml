# this_file: .github/workflows/ci.yml
name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PyO3 0.22 supports Python <= 3.13; pin the interpreter it builds against.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: ./test.sh
        env:
          PYO3_PYTHON: python
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
